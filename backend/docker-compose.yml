name: expense-claims

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: ${DB_NAME:-expenses}
      MYSQL_USER: ${DB_USER:-expenses}
      MYSQL_PASSWORD: ${DB_PASSWORD:-expenses}
    ports:
      - "${DB_PORT:-3310}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 3s
      retries: 30

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-expenses}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-expenses123}
      MINIO_DEFAULT_BUCKETS: ${S3_BUCKET:-receipts}
      MINIO_BROWSER: "on"
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  mysql-data:
  minio-data:
